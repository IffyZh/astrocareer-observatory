name: Scheduled collection

on:
  schedule:
    # Twice daily, with a margin above the source's six-hour minimum interval.
    - cron: "23 */12 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: scheduled-collection
  cancel-in-progress: false

jobs:
  collect:
    name: Collect reviewed sources
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .

      - name: Restore the latest collector database
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/automation
          if gh run download --repo "$GITHUB_REPOSITORY" \
              --name collector-state --dir data/automation; then
            test -f data/automation/astrocareer.sqlite3
            echo "restored=true" >> "$GITHUB_OUTPUT"
          else
            echo "No earlier collector-state artifact; initializing a new database."
            echo "restored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect and normalize the reviewed feed
        run: |
          python -m astrocareer collect planetary-research-jobs-feed \
            --database data/automation/astrocareer.sqlite3 \
            --registry data/sources.toml

      - name: Verify database integrity
        run: |
          python -m astrocareer db init data/automation/astrocareer.sqlite3

      - name: Write run summary
        env:
          DATABASE_PATH: data/automation/astrocareer.sqlite3
          STATE_RESTORED: ${{ steps.restore.outputs.restored }}
        run: |
          python scripts/write_collection_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Save collector database for the next run
        uses: actions/upload-artifact@v7
        with:
          name: collector-state
          path: data/automation/astrocareer.sqlite3
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

